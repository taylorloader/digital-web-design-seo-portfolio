<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Denham button system — resting and hover states</title><desc id="desc">A visual comparison of primary, secondary and tertiary website buttons in their resting and hover states.</desc>
<defs>
<linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8f151a"/><stop offset=".28" stop-color="#a61b20"/><stop offset=".5" stop-color="#861316"/><stop offset=".53" stop-color="#b94b4e"/><stop offset=".7" stop-color="#861316"/><stop offset="1" stop-color="#9d151a"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff6e3"/><stop offset=".24" stop-color="#f2deae"/><stop offset=".44" stop-color="#d8b56a"/><stop offset=".58" stop-color="#fff0c9"/><stop offset=".76" stop-color="#b78218"/><stop offset="1" stop-color="#8e6210"/></linearGradient>
<linearGradient id="cream" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff6d6"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#c79a35"/></linearGradient>
<linearGradient id="photo" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#817364"/><stop offset="1" stop-color="#3d3632"/></linearGradient>
<filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000" flood-opacity=".15"/></filter>
</defs>
<rect width="1440" height="900" fill="#f6f3ee"/>
<text x="96" y="76" fill="#b78218" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3">BEST WESTERN PREMIER DENHAM INN &amp; SUITES</text>
<text x="96" y="137" fill="#1c1a17" font-family="Arial,sans-serif" font-size="52" font-weight="700">Button System</text>
<text x="96" y="177" fill="#6b645a" font-family="Arial,sans-serif" font-size="22">Three coordinated button styles · resting and hover states</text>
<g font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#82796e"><text x="340" y="246" text-anchor="middle">RESTING STATE</text><text x="1040" y="246" text-anchor="middle">HOVER STATE</text></g>
<rect x="80" y="270" width="1280" height="170" rx="18" fill="#fff" stroke="#e6dfd3"/><text x="120" y="315" fill="#1c1a17" font-family="Arial,sans-serif" font-size="26" font-weight="700">Primary</text><text x="120" y="342" fill="#8a8276" font-family="Arial,sans-serif" font-size="15">Red → Gold</text><rect x="210" y="355" width="260" height="58" rx="5" fill="url(#red)" filter="url(#shadow)"/><text x="340" y="391" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Explore Rooms &amp; Suites</text><rect x="910" y="351" width="260" height="58" rx="5" fill="url(#gold)" filter="url(#shadow)"/><text x="1040" y="387" fill="#111" font-family="Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Explore Rooms &amp; Suites</text>
<rect x="80" y="465" width="1280" height="170" rx="18" fill="#fff" stroke="#e6dfd3"/><text x="120" y="510" fill="#1c1a17" font-family="Arial,sans-serif" font-size="26" font-weight="700">Secondary</text><text x="120" y="537" fill="#8a8276" font-family="Arial,sans-serif" font-size="15">Cream → Red</text><rect x="210" y="550" width="260" height="58" rx="5" fill="url(#cream)" stroke="#d4b56d" filter="url(#shadow)"/><text x="340" y="586" fill="#111" font-family="Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Make Inquiry</text><rect x="910" y="546" width="260" height="58" rx="5" fill="url(#red)" filter="url(#shadow)"/><text x="1040" y="582" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Make Inquiry</text>
<rect x="80" y="660" width="1280" height="170" rx="18" fill="#fff" stroke="#e6dfd3"/><text x="120" y="705" fill="#1c1a17" font-family="Arial,sans-serif" font-size="26" font-weight="700">Tertiary</text><text x="120" y="732" fill="#8a8276" font-family="Arial,sans-serif" font-size="15">Frosted glass → Gold</text><rect x="210" y="745" width="260" height="58" rx="5" fill="url(#photo)"/><rect x="210" y="745" width="260" height="58" rx="5" fill="#fff" fill-opacity=".62" stroke="#fff" stroke-opacity=".65"/><text x="340" y="781" fill="#111" font-family="Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Weddings &amp; Celebrations</text><rect x="910" y="741" width="260" height="58" rx="5" fill="url(#gold)" filter="url(#shadow)"/><text x="1040" y="777" fill="#111" font-family="Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">Weddings &amp; Celebrations</text>
</svg>